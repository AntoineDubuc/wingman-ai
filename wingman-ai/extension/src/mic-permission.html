<!DOCTYPE html>
<html lang="en">
<head>
  <title>Wingman AI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
      text-align: center;
    }
    .container { padding: 24px; }
    h2 { margin: 0 0 8px; font-size: 16px; color: #fff; }
    p { margin: 0; font-size: 13px; color: #999; }
    .denied { color: #ff6b6b; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Strings injected by mic-permission-locale.ts on DOMContentLoaded -->
    <h2 id="permission-title"></h2>
    <p id="permission-body"></p>
    <p id="denied" class="denied" style="display:none"></p>
  </div>
  <!-- mic-permission-locale.ts: Vite-processed TS module — handles i18n init and string injection -->
  <script type="module" src="mic-permission-locale.ts"></script>
  <!-- mic-permission.js: static script — handles getUserMedia permission request flow -->
  <script src="mic-permission.js"></script>
</body>
</html>
